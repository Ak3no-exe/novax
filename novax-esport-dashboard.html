<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NØVΛX ESPORT</title>
<style>
  :root{
    --bg: #08070c;
    --panel: #100e18;
    --panel2: #17141f;
    --border: #2a2438;
    --purple: #a259ff;
    --cyan: #4dfff3;
    --pink: #ff4dd8;
    --text: #f1eefc;
    --muted: #8b849e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, rgba(162,89,255,0.15), transparent 40%),
      radial-gradient(circle at 80% 10%, rgba(77,255,243,0.10), transparent 35%),
      var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    padding:28px 20px 20px;
    text-align:center;
    border-bottom:1px solid var(--border);
    position:relative;
  }
  header h1{
    margin:0;
    font-size:clamp(28px,7vw,42px);
    letter-spacing:4px;
    font-weight:800;
    background:linear-gradient(90deg,var(--purple),var(--cyan));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(162,89,255,0.35);
  }
  header p{color:var(--muted);margin:6px 0 0;font-size:13px;letter-spacing:1px;text-transform:uppercase;}

  .tab-bar{
    display:flex;justify-content:center;margin-top:16px;gap:10px;flex-wrap:wrap;
  }
  .tab{
    padding:10px 20px;
    border:1px solid var(--border);
    border-radius:999px;
    color:var(--muted);
    font-weight:700;
    letter-spacing:1.5px;
    font-size:12px;
    background:var(--panel);
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab.active{
    border-color:var(--purple);
    color:var(--purple);
    background:rgba(162,89,255,0.10);
  }

  main{max-width:1100px;margin:0 auto;padding:24px 16px;}
  .game-section{display:none;}
  .game-section.active{display:block;}

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin-bottom:24px;
  }
  .stat-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    text-align:center;
  }
  .stat-card .val{font-size:22px;font-weight:800;color:var(--cyan);}
  .stat-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}

  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;flex-wrap:wrap;gap:10px;
  }
  .toolbar h2{font-size:16px;letter-spacing:1px;margin:0;color:var(--text);}
  button.primary{
    background:linear-gradient(90deg,var(--purple),var(--pink));
    border:none;color:#fff;padding:10px 18px;border-radius:10px;
    font-weight:700;cursor:pointer;letter-spacing:0.5px;font-size:13px;
  }
  button.primary:active{opacity:0.8;}

  .roster{display:flex;flex-direction:column;gap:10px;}
  .player-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .player-left{display:flex;align-items:center;gap:12px;}
  .avatar{
    width:42px;height:42px;border-radius:10px;
    background:linear-gradient(135deg,var(--purple),var(--cyan));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#08070c;font-size:16px;flex-shrink:0;
  }
  .pname{font-weight:700;font-size:15px;}
  .prole{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
  .pstats{display:flex;gap:16px;flex-wrap:wrap;}
  .pstat{text-align:center;min-width:54px;}
  .pstat .n{font-weight:800;font-size:15px;color:var(--cyan);}
  .pstat .l{font-size:10px;color:var(--muted);text-transform:uppercase;}
  .card-actions{display:flex;gap:8px;}
  .icon-btn{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{border-color:var(--purple);}
  .icon-btn.danger:hover{border-color:#ff4d6a;color:#ff4d6a;}

  .empty{
    text-align:center;color:var(--muted);padding:50px 20px;
    border:1px dashed var(--border);border-radius:14px;
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:22px;width:100%;max-width:420px;
    max-height:90vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 16px;letter-spacing:1px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input, .field select{
    width:100%;padding:10px 12px;border-radius:8px;
    border:1px solid var(--border);background:var(--panel2);color:var(--text);
    font-size:14px;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--purple);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions button{flex:1;padding:11px;border-radius:10px;border:none;font-weight:700;cursor:pointer;}
  .btn-cancel{background:var(--panel2);color:var(--text);border:1px solid var(--border) !important;}
  .btn-save{background:linear-gradient(90deg,var(--purple),var(--cyan));color:#08070c;}

  .loading{text-align:center;color:var(--muted);padding:30px;}

  .confirm-modal{max-width:340px;text-align:center;}
  .confirm-modal p{color:var(--text);font-size:14px;margin:0 0 20px;}
  .btn-danger{background:linear-gradient(90deg,#ff4d6a,var(--pink)) !important;color:#fff !important;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--purple);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:13px;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <h1>NØVΛX ESPORT</h1>
  <p>Team Management</p>
  <div class="tab-bar">
    <div class="tab active" id="tabBtn-fortnite" onclick="switchGame('fortnite')">FORTNITE</div>
    <div class="tab" id="tabBtn-rl" onclick="switchGame('rl')">ROCKET LEAGUE SIDESWIPE</div>
  </div>
</header>

<main>

  <!-- FORTNITE SECTION -->
  <section class="game-section active" id="section-fortnite">
    <div class="stats" id="stats-fortnite"></div>
    <div class="toolbar">
      <h2>ROSTER FORTNITE</h2>
      <button class="primary" onclick="openModal('fortnite')">+ Ajouter un joueur</button>
    </div>
    <div id="rosterContainer-fortnite" class="loading">Chargement...</div>
  </section>

  <!-- ROCKET LEAGUE SIDESWIPE SECTION -->
  <section class="game-section" id="section-rl">
    <div class="stats" id="stats-rl"></div>
    <div class="toolbar">
      <h2>ROSTER ROCKET LEAGUE SIDESWIPE</h2>
      <button class="primary" onclick="openModal('rl')">+ Ajouter un joueur</button>
    </div>
    <div id="rosterContainer-rl" class="loading">Chargement...</div>
  </section>

</main>

<!-- MODAL FORTNITE -->
<div class="overlay" id="overlay-fortnite">
  <div class="modal">
    <h3 id="modalTitle-fortnite">Ajouter un joueur</h3>
    <input type="hidden" id="editId-fortnite">
    <div class="field">
      <label>Pseudo</label>
      <input type="text" id="fPseudo-fortnite" placeholder="ex: Zynox">
    </div>
    <div class="field">
      <label>Rôle</label>
      <select id="fRole-fortnite">
        <option>IGL</option>
        <option>Fragger</option>
        <option>Builder</option>
        <option>Sniper</option>
        <option>Support</option>
        <option>Coach</option>
      </select>
    </div>
    <div class="row2">
      <div class="field">
        <label>Victoires</label>
        <input type="number" id="fWins-fortnite" placeholder="0" min="0">
      </div>
      <div class="field">
        <label>Éliminations</label>
        <input type="number" id="fKills-fortnite" placeholder="0" min="0">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Classement</label>
        <input type="text" id="fRank-fortnite" placeholder="ex: #12 FR">
      </div>
      <div class="field">
        <label>Gains ($)</label>
        <input type="number" id="fEarnings-fortnite" placeholder="0" min="0">
      </div>
    </div>
    <div class="field">
      <label>Matchs joués</label>
      <input type="number" id="fMatches-fortnite" placeholder="0" min="0">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('fortnite')">Annuler</button>
      <button class="btn-save" onclick="savePlayer('fortnite')">Enregistrer</button>
    </div>
  </div>
</div>

<!-- MODAL ROCKET LEAGUE (pseudo + rank uniquement) -->
<div class="overlay" id="overlay-rl">
  <div class="modal">
    <h3 id="modalTitle-rl">Ajouter un joueur</h3>
    <input type="hidden" id="editId-rl">
    <div class="field">
      <label>Pseudo</label>
      <input type="text" id="fPseudo-rl" placeholder="ex: Zynox">
    </div>
    <div class="field">
      <label>Rank</label>
      <input type="text" id="fRank-rl" placeholder="ex: Grand Champion">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('rl')">Annuler</button>
      <button class="btn-save" onclick="savePlayer('rl')">Enregistrer</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay-confirm">
  <div class="modal confirm-modal">
    <h3>Supprimer ce joueur ?</h3>
    <p>Cette action est définitive.</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeConfirm()">Annuler</button>
      <button class="btn-save btn-danger" onclick="confirmDelete()">Supprimer</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const games = {
  fortnite: { players: [], storageKey: 'novax_players_fortnite' },
  rl:       { players: [], storageKey: 'novax_players_rl' }
};
let currentGame = 'fortnite';

function switchGame(game){
  currentGame = game;
  document.getElementById('tabBtn-fortnite').classList.toggle('active', game==='fortnite');
  document.getElementById('tabBtn-rl').classList.toggle('active', game==='rl');
  document.getElementById('section-fortnite').classList.toggle('active', game==='fortnite');
  document.getElementById('section-rl').classList.toggle('active', game==='rl');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function initials(name){
  return (name||'?').trim().slice(0,2).toUpperCase();
}

async function loadGame(game){
  try{
    const raw = localStorage.getItem(games[game].storageKey);
    games[game].players = raw ? JSON.parse(raw) : [];
  }catch(e){
    games[game].players = [];
  }
  render(game);
}

async function persist(game){
  try{
    localStorage.setItem(games[game].storageKey, JSON.stringify(games[game].players));
  }catch(e){
    console.error('Erreur de sauvegarde', e);
  }
}

function render(game){
  const players = games[game].players;
  const container = document.getElementById('rosterContainer-' + game);
  const statsEl = document.getElementById('stats-' + game);

  if(game === 'fortnite'){
    const totalEarnings = players.reduce((s,p)=>s+(Number(p.earnings)||0),0);
    const totalWins = players.reduce((s,p)=>s+(Number(p.wins)||0),0);
    const totalKills = players.reduce((s,p)=>s+(Number(p.kills)||0),0);
    statsEl.innerHTML = `
      <div class="stat-card"><div class="val">${players.length}</div><div class="lbl">Joueurs</div></div>
      <div class="stat-card"><div class="val">${totalWins}</div><div class="lbl">Victoires</div></div>
      <div class="stat-card"><div class="val">${totalKills}</div><div class="lbl">Éliminations</div></div>
      <div class="stat-card"><div class="val">$${totalEarnings.toLocaleString('fr-FR')}</div><div class="lbl">Gains totaux</div></div>
    `;
  } else {
    statsEl.innerHTML = `
      <div class="stat-card"><div class="val">${players.length}</div><div class="lbl">Joueurs</div></div>
    `;
  }

  if(players.length === 0){
    container.className = '';
    container.innerHTML = `<div class="empty">Aucun joueur pour le moment.<br>Ajoute ton premier joueur avec le bouton ci-dessus.</div>`;
    return;
  }

  container.className = 'roster';

  if(game === 'fortnite'){
    container.innerHTML = players.map(p => `
      <div class="player-card">
        <div class="player-left">
          <div class="avatar">${initials(p.pseudo)}</div>
          <div>
            <div class="pname">${escapeHtml(p.pseudo)}</div>
            <div class="prole">${escapeHtml(p.role||'')}</div>
          </div>
        </div>
        <div class="pstats">
          <div class="pstat"><div class="n">${p.wins||0}</div><div class="l">Wins</div></div>
          <div class="pstat"><div class="n">${p.kills||0}</div><div class="l">Kills</div></div>
          <div class="pstat"><div class="n">${escapeHtml(p.rank||'-')}</div><div class="l">Rang</div></div>
          <div class="pstat"><div class="n">$${(Number(p.earnings)||0).toLocaleString('fr-FR')}</div><div class="l">Gains</div></div>
          <div class="pstat"><div class="n">${p.matches||0}</div><div class="l">Matchs</div></div>
        </div>
        <div class="card-actions">
          <button class="icon-btn" onclick="editPlayer('fortnite','${p.id}')">✎</button>
          <button class="icon-btn danger" onclick="deletePlayer('fortnite','${p.id}')">🗑 Supprimer</button>
        </div>
      </div>
    `).join('');
  } else {
    container.innerHTML = players.map(p => `
      <div class="player-card">
        <div class="player-left">
          <div class="avatar">${initials(p.pseudo)}</div>
          <div>
            <div class="pname">${escapeHtml(p.pseudo)}</div>
          </div>
        </div>
        <div class="pstats">
          <div class="pstat"><div class="n">${escapeHtml(p.rank||'-')}</div><div class="l">Rank</div></div>
        </div>
        <div class="card-actions">
          <button class="icon-btn" onclick="editPlayer('rl','${p.id}')">✎</button>
          <button class="icon-btn danger" onclick="deletePlayer('rl','${p.id}')">🗑 Supprimer</button>
        </div>
      </div>
    `).join('');
  }
}

function openModal(game){
  document.getElementById('modalTitle-' + game).textContent = 'Ajouter un joueur';
  document.getElementById('editId-' + game).value = '';
  document.getElementById('fPseudo-' + game).value = '';
  document.getElementById('fRank-' + game).value = '';
  if(game === 'fortnite'){
    document.getElementById('fRole-fortnite').value = 'IGL';
    document.getElementById('fWins-fortnite').value = '';
    document.getElementById('fKills-fortnite').value = '';
    document.getElementById('fEarnings-fortnite').value = '';
    document.getElementById('fMatches-fortnite').value = '';
  }
  document.getElementById('overlay-' + game).classList.add('show');
}

function editPlayer(game, id){
  const p = games[game].players.find(x => x.id === id);
  if(!p) return;
  document.getElementById('modalTitle-' + game).textContent = 'Modifier le joueur';
  document.getElementById('editId-' + game).value = p.id;
  document.getElementById('fPseudo-' + game).value = p.pseudo || '';
  document.getElementById('fRank-' + game).value = p.rank || '';
  if(game === 'fortnite'){
    document.getElementById('fRole-fortnite').value = p.role || 'IGL';
    document.getElementById('fWins-fortnite').value = p.wins || '';
    document.getElementById('fKills-fortnite').value = p.kills || '';
    document.getElementById('fEarnings-fortnite').value = p.earnings || '';
    document.getElementById('fMatches-fortnite').value = p.matches || '';
  }
  document.getElementById('overlay-' + game).classList.add('show');
}

function closeModal(game){
  document.getElementById('overlay-' + game).classList.remove('show');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

let pendingDelete = null;

function deletePlayer(game, id){
  pendingDelete = { game, id };
  document.getElementById('overlay-confirm').classList.add('show');
}

function closeConfirm(){
  pendingDelete = null;
  document.getElementById('overlay-confirm').classList.remove('show');
}

async function confirmDelete(){
  if(!pendingDelete) return;
  const { game, id } = pendingDelete;
  games[game].players = games[game].players.filter(p => p.id !== id);
  await persist(game);
  render(game);
  closeConfirm();
  showToast('Joueur supprimé.');
}

async function savePlayer(game){
  const pseudo = document.getElementById('fPseudo-' + game).value.trim();
  if(!pseudo){ showToast('Le pseudo est obligatoire.'); return; }
  const id = document.getElementById('editId-' + game).value;

  let data = { pseudo, rank: document.getElementById('fRank-' + game).value.trim() };

  if(game === 'fortnite'){
    data.role = document.getElementById('fRole-fortnite').value;
    data.wins = Number(document.getElementById('fWins-fortnite').value) || 0;
    data.kills = Number(document.getElementById('fKills-fortnite').value) || 0;
    data.earnings = Number(document.getElementById('fEarnings-fortnite').value) || 0;
    data.matches = Number(document.getElementById('fMatches-fortnite').value) || 0;
  }

  const players = games[game].players;
  if(id){
    const idx = players.findIndex(x => x.id === id);
    if(idx > -1) players[idx] = {...players[idx], ...data};
  } else {
    data.id = game + '_' + Date.now();
    players.push(data);
  }

  await persist(game);
  render(game);
  closeModal(game);
}

loadGame('fortnite');
loadGame('rl');
</script>

</body>
</html>
